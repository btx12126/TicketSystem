<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket System - Add client</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Ticket System</h1>
    <nav>
      <a href="index.html">Tickets</a>
      <a href="add-ticket.html">Add ticket</a>
      <a href="add-client.html" aria-current="page">Add client</a>
      <a href="buy.html">Buy ticket</a>
    </nav>
  </header>

  <main>
    <p id="message" class="message" hidden></p>

    <section class="card narrow">
      <h2>Add client</h2>
      <form id="client-form">
        <label>First name
          <input name="name" required>
        </label>
        <label>Last name
          <input name="surname" required>
        </label>
        <button type="submit">Add client</button>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/add-client.js"></script>
</body>
</html>
