name: ticket-system

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tickets
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      # Optional: lets you inspect the Docker database from MySQL Workbench
      # (host 127.0.0.1, port 3307). 3307 is used so it does not clash with a local MySQL on 3306.
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # These override the values from application.properties (which point to localhost).
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tickets?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "8080:8080"

  frontend:
    image: nginx:alpine
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "5500:80"

volumes:
  mysqldata:
